name: Reusable Cloudflare Worker Deploy

on:
  workflow_call:
    inputs:
      production_url:
        description: Production URL to smoke-test and visually verify
        required: true
        type: string
      working_directory:
        description: Repository working directory
        required: false
        default: "."
        type: string
      node_version:
        description: Node.js version
        required: false
        default: "24"
        type: string
      cloudflare_account_id:
        description: Cloudflare account ID from repository/org variable
        required: false
        default: ""
        type: string
      worker_name:
        description: Cloudflare Worker name for access diagnostics
        required: false
        default: ""
        type: string
      visual_paths:
        description: Comma-separated production paths to capture for DPL evidence
        required: false
        default: "/"
        type: string
      install_command:
        description: Install command. Empty string skips install.
        required: false
        default: "npm ci"
        type: string
      build_command:
        description: Build command. Empty string skips build.
        required: false
        default: "npm run build"
        type: string
      deploy_command:
        description: Cloudflare deploy command
        required: false
        default: "npx wrangler deploy"
        type: string
      smoke_mode:
        description: public or basic_auth
        required: false
        default: "public"
        type: string
      unauthenticated_status:
        description: Expected HTTP status without credentials for protected sites
        required: false
        default: "401"
        type: string
      basic_auth_user_binding:
        description: Worker secret binding for Basic Auth username
        required: false
        default: "BASIC_AUTH_USER"
        type: string
      basic_auth_password_binding:
        description: Worker secret binding for Basic Auth password
        required: false
        default: "BASIC_AUTH_PASSWORD"
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      DEPLOY_BASIC_AUTH_USER:
        required: false
      DEPLOY_BASIC_AUTH_PASSWORD:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
      DEPLOY_BASIC_AUTH_USER: ${{ secrets.DEPLOY_BASIC_AUTH_USER }}
      DEPLOY_BASIC_AUTH_PASSWORD: ${{ secrets.DEPLOY_BASIC_AUTH_PASSWORD }}

    steps:
      - name: Production release event policy
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [ "$event" = "pull_request" ] || [ "$event" = "pull_request_target" ]; then
            echo "::error::Production deployment from PR events is forbidden by ZestfulPulse policy."
            echo "::error::PR workflows must build/capture only. Deploy after merge/push or explicit workflow_dispatch."
            exit 1
          fi
          echo "Release event policy PASS: $event"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Credential preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository/shared secret CLOUDFLARE_API_TOKEN. Run ZestfulPulse Project Bootstrap/retrofit before production deploy."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository/shared variable CLOUDFLARE_ACCOUNT_ID. Run ZestfulPulse Project Bootstrap/retrofit before production deploy."; exit 1; }

          mode="${{ inputs.smoke_mode }}"
          case "$mode" in
            public) ;;
            basic_auth)
              test -n "$DEPLOY_BASIC_AUTH_USER" || { echo "::error::Missing DEPLOY_BASIC_AUTH_USER mapping for protected deployment."; exit 1; }
              test -n "$DEPLOY_BASIC_AUTH_PASSWORD" || { echo "::error::Missing DEPLOY_BASIC_AUTH_PASSWORD mapping for protected deployment."; exit 1; }
              ;;
            *)
              echo "::error::Unsupported smoke_mode: $mode"
              exit 1
              ;;
          esac

          npx wrangler whoami

      - name: Worker access diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking Workers product access..."
          scripts_code=$(curl -sS -o /tmp/cf-scripts.json -w "%{http_code}"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "workers/scripts HTTP $scripts_code"
          if [ "$scripts_code" != "200" ]; then
            cat /tmp/cf-scripts.json
            echo "Workers product access denied."
            exit 1
          fi

          WORKER_NAME="${{ inputs.worker_name }}"
          if [ -z "$WORKER_NAME" ]; then
            echo "No worker_name supplied; product-level authorization is confirmed."
            exit 0
          fi

          export WORKER_NAME
          visible=$(python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/cf-scripts.json'))
          names=[x.get('id') for x in data.get('result',[]) if isinstance(x,dict)]
          print("yes" if os.environ["WORKER_NAME"] in names else "no")
          PY
          )
          echo "target_worker_visible=$visible"

          if [ "$visible" != "yes" ]; then
            echo "Target Worker does not exist yet; deployment may create it."
            exit 0
          fi

          assets_code=$(curl -sS -o /tmp/cf-assets.json -w "%{http_code}"             -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"manifest":{}}'             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/assets-upload-session")
          echo "assets-upload-session HTTP $assets_code"
          if [ "$assets_code" = "403" ]; then
            cat /tmp/cf-assets.json
            echo "Static-assets upload is denied for the target Worker."
            exit 1
          fi

      - name: Install
        if: ${{ inputs.install_command != '' }}
        shell: bash
        run: ${{ inputs.install_command }}

      - name: Build
        if: ${{ inputs.build_command != '' }}
        shell: bash
        run: ${{ inputs.build_command }}

      - name: Deploy
        shell: bash
        run: ${{ inputs.deploy_command }}

      - name: Sync protected-site auth secrets
        if: ${{ inputs.smoke_mode == 'basic_auth' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DEPLOY_BASIC_AUTH_USER" | npx wrangler secret put "${{ inputs.basic_auth_user_binding }}"
          printf '%s' "$DEPLOY_BASIC_AUTH_PASSWORD" | npx wrangler secret put "${{ inputs.basic_auth_password_binding }}"

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ inputs.smoke_mode }}"
          url="${{ inputs.production_url }}"

          if [ "$mode" = "public" ]; then
            for i in {1..18}; do
              if curl -fsS "$url" >/dev/null; then
                echo "Production smoke PASS"
                exit 0
              fi
              sleep 10
            done
            echo "Production smoke FAIL"
            exit 1
          fi

          expected="${{ inputs.unauthenticated_status }}"
          for i in {1..18}; do
            code=$(curl -sS -o /tmp/unauth.html -w "%{http_code}" "$url" || true)
            auth_code=$(curl -sS -u "$DEPLOY_BASIC_AUTH_USER:$DEPLOY_BASIC_AUTH_PASSWORD" -o /tmp/auth.html -w "%{http_code}" "$url" || true)
            bad_code=$(curl -sS -u "$DEPLOY_BASIC_AUTH_USER:__wrong_password__" -o /tmp/bad.html -w "%{http_code}" "$url" || true)
            echo "protected smoke: unauth=$code auth=$auth_code invalid=$bad_code"
            if [ "$code" = "$expected" ] && [ "$auth_code" = "200" ] && [ "$bad_code" = "$expected" ]; then
              echo "Protected production smoke PASS"
              exit 0
            fi
            sleep 10
          done
          echo "Protected production smoke FAIL"
          exit 1

      - name: Install Chromium for DPL visual QA
        working-directory: .
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture DPL production renders
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dpl-evidence
          IFS=',' read -ra paths <<< "${{ inputs.visual_paths }}"

          cat > /tmp/zp-capture.mjs <<'JS'
          import { chromium } from 'playwright';
          const [url, widePath, narrowPath, mode, user, password] = process.argv.slice(2);
          const browser = await chromium.launch({headless:true});
          for (const [viewport, out] of [
            [{width:1440,height:1200}, widePath],
            [{width:390,height:844}, narrowPath]
          ]) {
            const context = await browser.newContext({
              viewport,
              ...(mode === 'basic_auth' ? {httpCredentials:{username:user,password}} : {})
            });
            const page = await context.newPage();
            const response = await page.goto(url, {waitUntil:'networkidle'});
            if (!response || response.status() >= 400) {
              throw new Error(`capture failed: ${url} status=${response?.status()}`);
            }
            await page.screenshot({path:out, fullPage:true});
            await context.close();
          }
          await browser.close();
          JS

          for raw in "${paths[@]}"; do
            path=$(echo "$raw" | xargs)
            [ -n "$path" ] || path="/"
            case "$path" in
              /*) ;;
              *) path="/$path" ;;
            esac

            if [ "$path" = "/" ]; then
              slug="home"
            else
              slug=$(echo "$path" | sed 's#^/##; s#[/?&=]#-#g; s#[^A-Za-z0-9._-]#-#g')
            fi

            url="${{ inputs.production_url }}"
            url="${url%/}$path"
            echo "Capture $slug -> $url"

            npx --yes -p playwright@1.55.0 node /tmp/zp-capture.mjs               "$url"               "dpl-evidence/${slug}-wide.png"               "dpl-evidence/${slug}-narrow.png"               "${{ inputs.smoke_mode }}"               "$DEPLOY_BASIC_AUTH_USER"               "$DEPLOY_BASIC_AUTH_PASSWORD"
          done

      - name: Upload DPL visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpl-visual-evidence
          path: dpl-evidence/
          if-no-files-found: error
