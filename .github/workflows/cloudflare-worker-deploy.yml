name: Reusable Cloudflare Worker Deploy

on:
  workflow_call:
    inputs:
      production_url:
        description: Production URL to smoke-test and visually verify
        required: true
        type: string
      working_directory:
        description: Repository working directory
        required: false
        default: "."
        type: string
      node_version:
        description: Node.js version
        required: false
        default: "24"
        type: string
      cloudflare_account_id:
        description: Cloudflare account ID from organization variable
        required: false
        default: ""
        type: string
      worker_name:
        description: Cloudflare Worker name for access diagnostics
        required: false
        default: ""
        type: string
      visual_paths:
        description: Comma-separated production paths to capture for DPL evidence
        required: false
        default: "/"
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}

    steps:
      - name: Production release event policy
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [ "$event" = "pull_request" ] || [ "$event" = "pull_request_target" ]; then
            echo "::error::Production deployment from PR events is forbidden by ZestfulPulse policy."
            echo "::error::PR workflows must build/capture only. Deploy after merge/push or explicit workflow_dispatch."
            exit 1
          fi
          echo "Release event policy PASS: $event"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Credential preflight
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository/shared secret CLOUDFLARE_API_TOKEN. Run ZestfulPulse Project Bootstrap/retrofit before production deploy."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository/shared variable CLOUDFLARE_ACCOUNT_ID. Run ZestfulPulse Project Bootstrap/retrofit before production deploy."; exit 1; }
          npx wrangler whoami

      - name: Worker access diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking Workers product access..."
          scripts_code=$(curl -sS -o /tmp/cf-scripts.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "workers/scripts HTTP $scripts_code"
          if [ "$scripts_code" != "200" ]; then
            cat /tmp/cf-scripts.json
            echo "Workers product access denied."
            exit 1
          fi

          WORKER_NAME="${{ inputs.worker_name }}"
          if [ -z "$WORKER_NAME" ]; then
            echo "No worker_name supplied; product-level authorization is confirmed."
            exit 0
          fi

          export WORKER_NAME
          visible=$(python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/cf-scripts.json'))
          names=[x.get('id') for x in data.get('result',[]) if isinstance(x,dict)]
          print("yes" if os.environ["WORKER_NAME"] in names else "no")
          PY
          )
          echo "target_worker_visible=$visible"

          if [ "$visible" != "yes" ]; then
            echo "Target Worker does not exist yet; deployment may create it."
            exit 0
          fi

          assets_code=$(curl -sS -o /tmp/cf-assets.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"manifest":{}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/assets-upload-session")
          echo "assets-upload-session HTTP $assets_code"
          if [ "$assets_code" = "403" ]; then
            cat /tmp/cf-assets.json
            echo "Static-assets upload is denied for the target Worker."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy

      - name: Production smoke
        shell: bash
        run: |
          for i in {1..18}; do
            if curl -fsS "${{ inputs.production_url }}" >/dev/null; then
              echo "Production smoke PASS"
              exit 0
            fi
            sleep 10
          done
          echo "Production smoke FAIL"
          exit 1

      - name: Install Chromium for DPL visual QA
        working-directory: .
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture DPL production renders
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dpl-evidence
          IFS=',' read -ra paths <<< "${{ inputs.visual_paths }}"
          for raw in "${paths[@]}"; do
            path=$(echo "$raw" | xargs)
            [ -n "$path" ] || path="/"
            case "$path" in
              /*) ;;
              *) path="/$path" ;;
            esac
            if [ "$path" = "/" ]; then
              slug="home"
            else
              slug=$(echo "$path" | sed 's#^/##; s#[/?&=]#-#g; s#[^A-Za-z0-9._-]#-#g')
            fi
            url="${{ inputs.production_url }}"
            url="${url%/}$path"
            echo "Capture $slug -> $url"
            npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1200" --full-page "$url" "dpl-evidence/${slug}-wide.png"
            npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page "$url" "dpl-evidence/${slug}-narrow.png"
          done

      - name: Upload DPL visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpl-visual-evidence
          path: dpl-evidence/
          if-no-files-found: error
